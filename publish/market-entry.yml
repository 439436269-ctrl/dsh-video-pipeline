description:
  en: 'Bundles 19 short-video production skills (1 orchestration, 17 atomic, 1 entry point) into the agent skill catalog: Chinese TTS pronunciation fixes, text-to-image and text-to-video, image panning, composition, covers, media verification, data review and four-platform publishing. Zero runtime dependencies; an installer''s own skill of the same name keeps precedence.'
  zh: '把一条短视频生产流水线的 19 个 skill（1 编排 + 17 原子 + 1 总入口）内置进 agent 技能目录：中文配音读音校正、文生图与文生视频、图片运镜、成片合成、封面、成片核验、数据复盘、四平台发布。无运行时依赖；使用者自己的同名 skill 优先级更高。'
